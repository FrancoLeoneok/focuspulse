<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #334155;
      object-fit: cover;
    }
    .user-info .details {
      flex: 1;
      overflow: hidden;
    }
    .user-info .name {
      font-size: 14px;
      font-weight: 600;
    }
    .user-info .email {
      font-size: 11px;
      color: #94a3b8;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-google {
      background: #4285f4;
      color: #fff;
    }
    .btn-focus {
      background: #16a34a;
      color: #fff;
      margin-top: 12px;
    }
    .btn-focus-active {
      background: #dc2626;
      color: #fff;
      margin-top: 12px;
    }
    .btn-logout {
      background: #334155;
      color: #f87171;
      margin-top: 8px;
      font-size: 12px;
    }
    .status {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 12px;
    }
    .timer {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #4ade80;
      margin: 8px 0;
      font-variant-numeric: tabular-nums;
    }
    .focus-label {
      text-align: center;
      font-size: 11px;
      color: #4ade80;
      margin-bottom: 4px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <img src="assets/icons/logo_main.png" alt="FocusPulse" style="width:64px;height:64px;display:block;margin:0 auto 8px auto;object-fit:contain;" />
    <h1>FocusPulse</h1>
    <p>Rastreo inteligente de productividad</p>
  </div>

  <!-- Estado: No logueado -->
  <div id="login-section">
    <button id="btn-login" class="btn btn-google">Iniciar sesión con Google</button>
  </div>

  <!-- Estado: Logueado -->
  <div id="user-section" class="hidden">
    <div class="user-info">
      <img id="user-photo" src="" alt="Foto" />
      <div class="details">
        <div id="user-name" class="name"></div>
        <div id="user-email" class="email"></div>
      </div>
    </div>

    <!-- Modo Enfoque -->
    <div id="focus-inactive">
      <button id="btn-focus" class="btn btn-focus">🎯 Iniciar Modo Enfoque (25 min)</button>
    </div>
    <div id="focus-active" class="hidden">
      <div class="focus-label">Modo Enfoque activo</div>
      <div id="focus-timer" class="timer">25:00</div>
      <button id="btn-stop-focus" class="btn btn-focus-active">⏹ Detener Modo Enfoque</button>
    </div>

    <button id="btn-logout" class="btn btn-logout">Cerrar sesión</button>
  </div>

  <div class="status" id="status-msg">Conecta tu cuenta para rastrear tu actividad.</div>

  <script src="popup.js"></script>
</body>
</html>
